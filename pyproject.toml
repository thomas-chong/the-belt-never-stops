[project]
name = "the-belt-never-stops"
version = "0.1.0"
description = "Make your AI agent think fast and slow: Jev (System One) + Gemini + code in one Google ADK workflow. DevFest Montréal 2026 demo."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "typesafe-sdk==0.7.5",
    "google-adk==2.13.0",
    "google-genai>=1.0",
    "pillow>=10",
    "playwright>=1.45",
    "pytest>=8",
]

[tool.uv]
package = false
